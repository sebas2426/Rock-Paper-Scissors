<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/scripts.js" defer></script>
</head>
<body>
    <h1>Rock, Paper, Scissors!!</h1>
    <div class="entire-container">
    <button id="play-button">Play!</button>
    <h3>To play a game of 5 rounds, select an option:</h3>
    <div id="container">
        <button id="Rock" class="optionButtons" disabled ><img src="./images/1.png" alt="Rock" class="option-image Rock"></button>
        <button id="Paper" class="optionButtons" disabled ><img src="./images/2.png" alt="Paper" class="option-image Paper" ></button>
        <button id="Scissors" class="optionButtons" disabled ><img src="./images/3.png" alt="Scissors" class="option-image Scissors" ></button>
    </div>
    
    
        
    </div>

    <div class="modal-container" id="modal-container" style="display: none;">
        <div class="modal">
            <div class="options-container">
                <div class="human-option-placeholder">
                    <p>Human Weapon</p>
                    
                    <img src="" id="human-option-placeholder" alt="">
                </div>
    
                <p>VS</p>
    
                <div class="computer-option-placeholder">
                    <p>Computer Weapon</p>
                    
                    <img src="" id="computer-option-placeholder" alt="">
                    
                </div>
            </div>
            <div id="Results"></div>
            <div class="buttons">
                <button id="play-again" >Play Again?</button>
                <button id="close">Close me</button>
            </div>
        </div>
        
    </div>
</div>
</body>
</html>
