<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/scripts.js" defer></script>
</head>
<body>
    <div class="language-container">
        <button class="button-languages" data-language="es">🇪🇸</button>
        <button class="button-languages" data-language="en" >🇬🇧</button>
    </div>
    <h1 data-section="titles" data-value="main">Rock, Paper, Scissors!!</h1>
    <div class="entire-container">
        <h4 data-section="descriptions" data-value="rounds" >Play a game of 5 rounds against the computer</h4>
        <h4 data-section="descriptions" data-value="howToPlay" >To start the game, click on the Play button bellow and select your option:</h4>
        <button data-section="descriptions" data-value="playButton"  id="play-button">Play!</button>
    <div id="container">
        <button id="Rock" class="optionButtons" disabled ><img src="./images/1.webp" alt="Rock" class="option-image Rock"></button>
        <button id="Paper" class="optionButtons" disabled ><img src="./images/2.webp" alt="Paper" class="option-image Paper" ></button>
        <button id="Scissors" class="optionButtons" disabled ><img src="./images/3.webp" alt="Scissors" class="option-image Scissors" ></button>
    </div>    
    </div>

    <div class="modal-container" id="modal-container" style="display: none;">
        <div class="modal">
            <div class="options-container">
                <div class="human-option-placeholder">
                    <h3 data-section="gameElements" data-value="humanWeapon" class="weo" >Player</h3>
                    
                    <img class="point_image human" src="./images/point.png" style="display: none;" alt="">
                    <img src="" id="human-option-placeholder" alt="">
                    <div class="scores human">
                        <h3 data-section="gameTexts" data-value="resultRound" >Score</h3>
                        <p id="human-score" >1</p>
                    </div>
                </div>
    
                <p style="font-style: italic;" id="vs">VS</p>
                <h4 style="font-style: italic;" data-section="gameElements" data-value="draw" id="draw">Draw!</h4>
                <div class="rounds">
                    <h3 data-section="gameTexts" data-value="numberRounds" >Round </h3>
                    <p id="number-rounds" >1</p>
                </div>
    
                <div class="computer-option-placeholder">
                    <h3 data-section="gameElements" data-value="computerWeapon" class="weo">Computer</h3>
                    
                    <img class="point_image computer" src="./images/point.png" style="display: none;" alt="">
                    <img src="" id="computer-option-placeholder" alt="">
                    <div class="scores computer">
                        <h3 data-section="gameTexts" data-value="resultRound" >Score</h3>
                        <p id="computer-score" >1</p>
                    </div>
                    
                </div>
            </div>
            <div id="Results"></div>
            <p data-section="gameTexts" data-value="finalComputer" id="final-computer" style="display: none;" >The Computer Wins!!</p>
            <p data-section="gameTexts" data-value="finalDraw" id="final-draw" style="display: none;" >Draw!!</p>
            <p data-section="gameTexts" data-value="finalHuman" id="final-human" style="display: none;" >You Win!!</p>
            <div class="buttons-result">
                <button data-section="gameButtons" data-value="playAgain" id="play-again-button">Play Again?</button>
                <button  data-section="gameButtons" data-value="close" id="close-button">Close me</button>
            </div>
        </div>
        
    </div>
</div>
</body>
</html>
