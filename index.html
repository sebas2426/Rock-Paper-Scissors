<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/scripts.js" defer></script>
</head>
<body>
    <h1 data-section="titles" data-value="main">Rock, Paper, Scissors!!</h1>
    <div class="language-container">
        <button  data-language="es">ES</button>
        <button data-language="en" >EN</button>
    </div>
    <div class="entire-container">
        <h4 data-section="descriptions" data-value="rounds" >Play a game of 5 rounds against the computer</h4>
        <h4 data-section="descriptions" data-value="howToPlay" >To start the game, click on the Play button bellow and select your option:</h4>
        <button id="play-button">Play!</button>
    <div id="container">
        <button id="Rock" class="optionButtons" disabled ><img src="./images/1.webp" alt="Rock" class="option-image Rock"></button>
        <button id="Paper" class="optionButtons" disabled ><img src="./images/2.webp" alt="Paper" class="option-image Paper" ></button>
        <button id="Scissors" class="optionButtons" disabled ><img src="./images/3.webp" alt="Scissors" class="option-image Scissors" ></button>
    </div>    
    </div>

    <div class="modal-container" id="modal-container" style="display: none;">
        <div class="modal">
            <div class="options-container">
                <div class="human-option-placeholder">
                    <p class="weo" >Human Weapon</p>
                    
                    <img class="point_image human" src="./images/point.png" style="display: none;" alt="">
                    <img src="" id="human-option-placeholder" alt="">
                </div>
    
                <p id="vs">VS</p>
                <p id="draw">Draw!</p>
    
                <div class="computer-option-placeholder">
                    <p class="weo">Computer Weapon</p>
                    
                    <img class="point_image computer" src="./images/point.png" style="display: none;" alt="">
                    <img src="" id="computer-option-placeholder" alt="">
                    
                </div>
            </div>
            <div id="Results"></div>
            <div class="buttons-result">
                <button id="play-again-button">Play Again?</button>
                <button id="close-button">Close me</button>
            </div>
        </div>
        
    </div>
</div>
</body>
</html>
